# ITssue → Jira 필드·선택값 매핑
#
# 출처: 노션 WBS M5-1-1 "Jira 필드 정의 및 데이터셋·AI 출력 스키마 매핑"
# 현재 대상: ITHD (Jira Software 스페이스 「ITssue HelpDesk」, 사이트 itssuehelpdesk.atlassian.net).
# 필드·선택값·상태 ID는 2026-10-26에 이 사이트의 생성 메타와 상태 목록을 조회해 맞췄다.
# 이전 사이트(ITSD)로 한 생성 검증(2026-10-19·20)의 ID는 이 사이트와 달라서 쓰지 않는다.
#
# 키 이름은 06 테이블 설계서의 DB 컬럼 이름(기준 이름)을 쓴다. (docs/07.API_계약서.md)
#   dataset_column: 과거 데이터셋(dataset/data/history.csv) 컬럼명. 이관 스크립트만 이 이름을 쓴다.
# 선택값의 키도 DB 영문 코드이고, Jira 에 저장되는 한글 값은 value 에 있다.
# 한글 → 영문 코드 변환은 과거 이관 스크립트에만 둔다.
#
# 사이트 주소·계정·API 토큰 같은 비밀 값은 이 파일에 넣지 않고 .env 로 관리한다.

version: "2026-10-26"

project:
  key: ITHD
  id: "10001"                # Jira Software 스페이스 「ITssue HelpDesk」
  # 일반 Jira이므로 service_desk_id와 JSM 요청 유형은 사용하지 않는다.

# ---------------------------------------------------------------- 필드
# jira:     Jira 필드 ID
# label:    Jira 화면 필드명 (Jira 쪽 이름이라 바꾸지 않음)
# type:     Jira 데이터 유형 (string · datetime · option · status · object)
# required: Jira 생성 메타 기준 필수 여부 (업무상 필수값은 미합의)

fields:
  receipt_no:
    jira: customfield_10043
    label: ITssue 접수번호
    dataset_column: inquiry_id
    type: string
    required: false
    note: 중복 생성 확인 키. 신규는 RCPT-####, 이관 건은 INQ-2026-xxxxx
  created_at:
    jira: customfield_10047
    label: 생성일자
    dataset_column: created_at
    type: datetime
    required: false
    note: 이관 건의 원 접수일시. 신규 티켓은 Jira 기본 생성일을 쓰고 이 칸은 비움
  channel:
    jira: customfield_10051
    label: 접수 채널
    dataset_column: channel
    type: string
    required: false
    note: 값은 options.channel. ITssue 신규 접수는 CHATBOT 고정
  handling_type:
    jira: customfield_10052
    label: 처리 유형
    dataset_column: handling_type
    type: string
    required: false
    note: 값은 options.handling_type. 신규 Jira 생성분은 TICKET 고정
  requester_employee_no:
    jira: customfield_10044
    label: 문의자 사번
    dataset_column: requester_id
    type: string
    required: false
    source: users.employee_no
  requester_name:
    jira: customfield_10045
    label: 문의자 이름
    type: string
    required: false
    source: users.name
  requester_department_name:
    jira: customfield_10046
    label: 문의자 부서
    dataset_column: requester_dept
    type: string
    required: false
    source: departments.name
  request_kind:
    jira: customfield_10049
    label: 티켓 유형
    dataset_column: ticket_type
    type: string
    required: false
    note: 값은 options.request_kind. Jira 기본 issuetype은 options.issue_type의 TASK 사용
  category_code:
    jira: customfield_10064
    label: IT 문의 분류
    dataset_column: category_code
    type: option
    required: false
  category_name:
    jira: customfield_10053
    label: 분류명
    dataset_column: category
    type: string
    required: false
    source: categories.name
  inquiry_type_name:
    jira: customfield_10054
    label: 세부 분류
    dataset_column: subcategory
    type: string
    required: false
    source: inquiry_types.name
  inquiry_type_code:
    jira: customfield_10055
    label: 시나리오 ID
    dataset_column: scenario_id
    type: string
    required: false
    source: inquiry_types.code (예 NET-02)
  target_system:
    jira: customfield_10056
    label: 대상 도구
    dataset_column: tool
    type: string
    required: false
  urgency:
    jira: customfield_10057
    label: 우선순위 등급
    dataset_column: urgency
    type: string
    required: false
    note: P1 ~ P4 그대로 저장. 기본 priority 는 options.urgency 참고
  urgency_label:
    jira: customfield_10066
    label: 긴급도
    dataset_column: urgency_label
    type: option
    required: false
    note: 저장하지 않고 urgency(P1~P4)에서 계산. 값은 options.urgency_label
  impact_scope:
    jira: customfield_10065
    label: 영향 범위
    dataset_column: impact_scope
    type: option
    required: false
    note: 신규 tickets 에는 아직 컬럼 없음 (노션 S3 #9 합의 후)
  title:
    jira: summary
    label: 요약
    dataset_column: title
    type: string
    required: true
  description:
    jira: customfield_10058
    label: 접수 내용
    dataset_column: description
    type: string
    required: false
    note: 기본 description 은 ADF 객체라 글자 그대로는 이 칸에 저장. 신규는 summary·onset·business_impact·tried_actions·aiSummary 를 합쳐 넣음
  work_status:
    jira: status
    label: 상태
    dataset_column: status
    type: status
    required: false
    note: 생성 메타에 없음. 생성 후 전환(transition)으로 맞춤
  group_name:
    jira: customfield_10059
    label: 담당 팀
    dataset_column: assigned_team
    type: string
    required: false
    source: support_groups.name
    note: components 에도 같은 그룹을 넣음 (options.group_name)
  assignee_name:
    jira: customfield_10050
    label: 처리 담당자
    dataset_column: assignee
    type: string
    required: false
    source: users.name (assignee_id)
    note: 담당자 이름 문자열. Jira 기본 assignee 는 support_group_members.jira_account_id 가 있을 때만 넣음
  resolved_at:
    jira: customfield_10048
    label: 완료일자
    dataset_column: resolved_at
    type: datetime
    required: false
    note: 이관 건만. 신규는 Jira 상태 이력으로 확인 (tickets.finished_at)
  root_cause:
    jira: customfield_10060
    label: 원인
    dataset_column: root_cause
    type: string
    required: false
    note: 이관 건만 (신규 3칸 분할은 노션 S3 #15 합의 후)
  resolution:
    jira: customfield_10061
    label: 처리 내용
    dataset_column: resolution
    type: string
    required: false
    source: tickets.resolution_note (신규) · legacy_inquiries.resolution (이관)
  prevention:
    jira: customfield_10062
    label: 재발 방지
    dataset_column: prevention
    type: string
    required: false
    note: 이관 건만
  related_faq:
    jira: customfield_10063
    label: 관련 FAQ
    dataset_column: related_faq
    type: string
    required: false

# ---------------------------------------------------------------- 선택값
# DB 코드 → Jira 저장값(value)과 옵션(객체) ID

options:
  category_code:
    field: customfield_10064
    values:
      ACC: { value: ACC, id: "10020" }
      ACS: { value: ACS, id: "10021" }
      NET: { value: NET, id: "10022" }
      SW:  { value: SW,  id: "10023" }
      HW:  { value: HW,  id: "10024" }
      SYS: { value: SYS, id: "10025" }
      SEC: { value: SEC, id: "10026" }

  impact_scope:
    field: customfield_10065
    values:
      PERSONAL:   { value: 개인, id: "10027" }
      DEPARTMENT: { value: 부서, id: "10028" }
      COMPANY:    { value: 전사, id: "10029" }

  urgency_label:
    field: customfield_10066
    values:
      P1: { label: 긴급, value: Critical, id: "10030" }
      P2: { label: 높음, value: High,     id: "10031" }
      P3: { label: 보통, value: Medium,   id: "10032" }
      P4: { label: 낮음, value: Low,      id: "10033" }

  urgency:
    field: priority
    values:
      P1: { value: Highest, id: "1" }
      P2: { value: High,    id: "2" }
      P3: { value: Medium,  id: "3" }
      P4: { value: Low,     id: "4" }

  group_name:
    field: components
    values:
      서비스데스크:     { value: 서비스데스크,     id: "10000" }
      엔드포인트지원팀: { value: 엔드포인트지원팀, id: "10001" }
      네트워크팀:       { value: 네트워크팀,       id: "10002" }
      시스템인프라팀:   { value: 시스템인프라팀,   id: "10003" }
      업무시스템팀:     { value: 업무시스템팀,     id: "10004" }
      정보보안팀:       { value: 정보보안팀,       id: "10005" }

  # 업무 유형은 텍스트 필드에 보존한다. Jira 기본 이슈 유형과 구분한다.
  request_kind:
    field: customfield_10049
    values:
      INCIDENT: { label: 장애, value: 장애 }
      REQUEST:  { label: 요청, value: 요청 }
      QUESTION: { label: 문의, value: 문의 }

  # 장애·요청·문의 모두 일반 Jira의 작업으로 생성한다.
  issue_type:
    field: issuetype
    values:
      TASK: { value: 작업, id: "10010" }

  # 문자열 필드라 옵션 ID 가 없다. value 를 그대로 저장한다.
  channel:
    field: customfield_10051
    values:
      PHONE:     { value: 전화 }
      MAIL:      { value: 메일 }
      MESSENGER: { value: 메신저 }
      CHATBOT:   { value: 챗봇 }   # ITssue 신규 접수. 이관 데이터에는 없음

  handling_type:
    field: customfield_10052
    values:
      IMMEDIATE: { value: 즉시 처리 }
      TICKET:    { value: 티켓 }

  work_status:
    field: status
    values:
      RDY: { value: RDY, id: "10004" }
      WIP: { value: WIP, id: "10005" }
      FIN: { value: FIN, id: "10006" }
      CLS: { value: CLS, id: "10007" }

# 일반 Jira 생성에는 JSM request_type(customfield_10010)을 전송하지 않는다.

# ---------------------------------------------------------------- 신규 접수 생성 규칙
# mapper.py 가 이 절을 읽어 ITHD 티켓 생성 요청을 만든다.
# 위 fields·options 는 그대로 쓰고, 생성할 때만 필요한 값을 여기에 둔다.

create:
  issue_type: TASK                 # options.issue_type
  browse_path: /browse/            # 티켓 주소 = JIRA_BASE_URL + browse_path + 키

  # 접수 데이터에 반드시 있어야 하는 키
  required: [receipt_no, title, category_code, urgency, group_name]

  # 항상 같은 값 (07 API 계약서 5장)
  constants:
    channel: CHATBOT
    handling_type: TICKET

  # 입력에 없고 다른 키에서 계산하는 값
  derived:
    urgency_label: urgency         # P1~P4 → 긴급도 옵션

  # 생성 요청에 넣지 않는 키 (이관 전용이거나 생성 후 전환으로 맞추는 값)
  skip: [created_at, resolved_at, work_status]

  # Jira 짧은 텍스트 칸 최대 글자 수. 넘으면 자르고 전체는 기본 description(ADF)에 남긴다.
  text_max_length: 255

  # description 이 없으면 아래 초안 항목을 제목과 함께 이어 붙여 접수 내용으로 쓴다.
  description_parts:
    summary: 문의 요약
    onset: 발생 시점
    business_impact: 업무 영향
    tried_actions: 시도한 조치
    ai_summary: AI 안내 내용
