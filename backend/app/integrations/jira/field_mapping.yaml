# ITssue → Jira 필드·선택값 매핑
#
# 출처: 노션 WBS M5-1-1 "Jira 필드 정의 및 데이터셋·AI 출력 스키마 매핑" (2026-10-18, 실제 Jira에서 조회한 값)
# 검증 범위: history.csv 티켓 350건(ITS-351 ~ ITS-700) 이관·전수 대조 완료 (M5-1-4, 불일치 0건)
#            신규 접수용 생성 API에서 같은 값이 통하는지는 아직 시험 전 (M5-1-2 · M5-1-4)
#
# 키 이름은 06 테이블 설계서의 DB 컬럼 이름(기준 이름)을 쓴다. (docs/07.API_계약서.md)
#   dataset_column: 과거 데이터셋(dataset/data/history.csv) 컬럼명. 이관 스크립트만 이 이름을 쓴다.
# 선택값의 키도 DB 영문 코드이고, Jira 에 저장되는 한글 값은 value 에 있다.
# 한글 → 영문 코드 변환은 과거 이관 스크립트에만 둔다.
#
# 사이트 주소·계정·API 토큰 같은 비밀 값은 이 파일에 넣지 않고 .env 로 관리한다.

version: "2026-10-19"

project:
  key: ITS
  id: "10006"
  service_desk_id: "5"        # Jira Service Management

# ---------------------------------------------------------------- 필드
# jira:     Jira 필드 ID
# label:    Jira 화면 필드명 (Jira 쪽 이름이라 바꾸지 않음)
# type:     Jira 데이터 유형 (string · datetime · option · status · object)
# required: Jira 생성 메타 기준 필수 여부 (업무상 필수값은 미합의)

fields:
  receipt_no:
    jira: customfield_10113
    label: ITssue 접수번호
    dataset_column: inquiry_id
    type: string
    required: false
    note: 중복 생성 확인 키. 신규는 RCPT-####, 이관 건은 INQ-2026-xxxxx
  created_at:
    jira: customfield_10115
    label: 생성일자
    dataset_column: created_at
    type: datetime
    required: false
    note: 이관 건의 원 접수일시. 신규 티켓은 Jira 기본 생성일을 쓰고 이 칸은 비움
  channel:
    jira: customfield_10123
    label: 접수 채널
    dataset_column: channel
    type: string
    required: false
    note: 값은 options.channel. ITssue 신규 접수는 CHATBOT 고정
  handling_type:
    jira: customfield_10124
    label: 처리 유형
    dataset_column: handling_type
    type: string
    required: false
    note: 값은 options.handling_type. 신규 Jira 생성분은 TICKET 고정
  requester_employee_no:
    jira: customfield_10114
    label: 문의자 사번
    dataset_column: requester_id
    type: string
    required: false
    source: users.employee_no
  requester_name:
    jira: customfield_10121
    label: 문의자 이름
    type: string
    required: false
    source: users.name
  requester_department_name:
    jira: customfield_10119
    label: 문의자 부서
    dataset_column: requester_dept
    type: string
    required: false
    source: departments.name
  request_kind:
    jira: customfield_10120
    label: 티켓 유형
    dataset_column: ticket_type
    type: string
    required: false
    note: 값은 options.request_kind (issuetype 도 같은 표에서 정함)
  category_code:
    jira: customfield_10117
    label: IT 문의 분류
    dataset_column: category_code
    type: option
    required: false
  category_name:
    jira: customfield_10125
    label: 분류명
    dataset_column: category
    type: string
    required: false
    source: categories.name
  inquiry_type_name:
    jira: customfield_10126
    label: 세부 분류
    dataset_column: subcategory
    type: string
    required: false
    source: inquiry_types.name
  inquiry_type_code:
    jira: customfield_10127
    label: 시나리오 ID
    dataset_column: scenario_id
    type: string
    required: false
    source: inquiry_types.code (예 NET-02)
  target_system:
    jira: customfield_10128
    label: 대상 도구
    dataset_column: tool
    type: string
    required: false
  urgency:
    jira: customfield_10129
    label: 우선순위 등급
    dataset_column: urgency
    type: string
    required: false
    note: P1 ~ P4 그대로 저장. 기본 priority 는 options.urgency 참고
  urgency_label:
    jira: customfield_10084
    label: 긴급도
    dataset_column: urgency_label
    type: option
    required: false
    note: 저장하지 않고 urgency(P1~P4)에서 계산. 값은 options.urgency_label
  impact_scope:
    jira: customfield_10118
    label: 영향 범위
    dataset_column: impact_scope
    type: option
    required: false
    note: 신규 tickets 에는 아직 컬럼 없음 (노션 S3 #9 합의 후)
  title:
    jira: summary
    label: 요약
    dataset_column: title
    type: string
    required: true
  description:
    jira: customfield_10130
    label: 접수 내용
    dataset_column: description
    type: string
    required: false
    note: 기본 description 은 ADF 객체라 글자 그대로는 이 칸에 저장. 신규는 summary·onset·business_impact·tried_actions·aiSummary 를 합쳐 넣음
  work_status:
    jira: status
    label: 상태
    dataset_column: status
    type: status
    required: false
    note: 생성 메타에 없음. 생성 후 전환(transition)으로 맞춤
  group_name:
    jira: customfield_10131
    label: 담당 팀
    dataset_column: assigned_team
    type: string
    required: false
    source: support_groups.name
    note: components 에도 같은 그룹을 넣음 (options.group_name)
  assignee_name:
    jira: customfield_10122
    label: 처리 담당자
    dataset_column: assignee
    type: string
    required: false
    source: users.name (assignee_id)
    note: 담당자 이름 문자열. Jira 기본 assignee 는 support_group_members.jira_account_id 가 있을 때만 넣음
  resolved_at:
    jira: customfield_10116
    label: 완료일자
    dataset_column: resolved_at
    type: datetime
    required: false
    note: 이관 건만. 신규는 Jira 상태 이력으로 확인 (tickets.finished_at)
  root_cause:
    jira: customfield_10132
    label: 원인
    dataset_column: root_cause
    type: string
    required: false
    note: 이관 건만 (신규 3칸 분할은 노션 S3 #15 합의 후)
  resolution:
    jira: customfield_10133
    label: 처리 내용
    dataset_column: resolution
    type: string
    required: false
    source: tickets.resolution_note (신규) · legacy_inquiries.resolution (이관)
  prevention:
    jira: customfield_10134
    label: 재발 방지
    dataset_column: prevention
    type: string
    required: false
    note: 이관 건만
  related_faq:
    jira: customfield_10135
    label: 관련 FAQ
    dataset_column: related_faq
    type: string
    required: false

# ---------------------------------------------------------------- 선택값
# DB 코드 → Jira 저장값(value)과 옵션(객체) ID

options:
  category_code:
    field: customfield_10117
    values:
      ACC: { value: ACC, id: "10282" }
      ACS: { value: ACS, id: "10283" }
      NET: { value: NET, id: "10284" }
      SW:  { value: SW,  id: "10285" }
      HW:  { value: HW,  id: "10286" }
      SYS: { value: SYS, id: "10287" }
      SEC: { value: SEC, id: "10288" }

  impact_scope:
    field: customfield_10118
    values:
      PERSONAL:   { value: 개인, id: "10289" }
      DEPARTMENT: { value: 부서, id: "10290" }
      COMPANY:    { value: 전사, id: "10291" }

  urgency_label:
    field: customfield_10084
    values:
      P1: { label: 긴급, value: Critical, id: "10192" }
      P2: { label: 높음, value: High,     id: "10193" }
      P3: { label: 보통, value: Medium,   id: "10194" }
      P4: { label: 낮음, value: Low,      id: "10195" }

  urgency:
    field: priority
    values:
      P1: { value: Highest, id: "1" }
      P2: { value: High,    id: "2" }
      P3: { value: Medium,  id: "3" }
      P4: { value: Low,     id: "4" }

  group_name:
    field: components
    values:
      서비스데스크:     { value: 서비스데스크,     id: "10054" }
      엔드포인트지원팀: { value: 엔드포인트지원팀, id: "10055" }
      네트워크팀:       { value: 네트워크팀,       id: "10056" }
      시스템인프라팀:   { value: 시스템인프라팀,   id: "10057" }
      업무시스템팀:     { value: 업무시스템팀,     id: "10058" }
      정보보안팀:       { value: 정보보안팀,       id: "10059" }

  request_kind:
    field: issuetype
    values:
      INCIDENT: { label: 장애, value: "[System] Incident",        id: "10036" }
      REQUEST:  { label: 요청, value: "[System] Service request", id: "10034" }
      QUESTION: { label: 문의, value: "[System] Service request", id: "10034" }

  # 문자열 필드라 옵션 ID 가 없다. value 를 그대로 저장한다.
  channel:
    field: customfield_10123
    values:
      PHONE:     { value: 전화 }
      MAIL:      { value: 메일 }
      MESSENGER: { value: 메신저 }
      CHATBOT:   { value: 챗봇 }   # ITssue 신규 접수. 이관 데이터에는 없음

  handling_type:
    field: customfield_10124
    values:
      IMMEDIATE: { value: 즉시 처리 }
      TICKET:    { value: 티켓 }

  work_status:
    field: status
    values:
      RDY: { value: RDY, id: "10063" }
      WIP: { value: WIP, id: "10064" }
      FIN: { value: FIN, id: "10065" }
      CLS: { value: CLS, id: "10066" }

# JSM 요청 유형: request_kind 와 category_code 를 함께 보고 정한다 (위에서부터 먼저 맞는 규칙 적용)
request_type:
  field: customfield_10010
  rules:
    - when: { request_kind: [REQUEST, QUESTION] }
      value: Get IT help
      id: "41"
    - when: { request_kind: [INCIDENT], category_code: [HW] }
      value: Report broken hardware
      id: "49"
    - when: { request_kind: [INCIDENT] }
      value: Report a system problem
      id: "48"
