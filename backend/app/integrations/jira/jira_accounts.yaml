# 사번(emp_id) ↔ Jira accountId 연결표 (시험용)
#
# 가상 기업의 담당 그룹 6개에서 1명씩 고른 사번과 실제 팀원의 Jira 계정을 1:1로 잇는다.
# 값이 비어 있으면 "Jira 계정 없음"으로 보고 배정 후보에서 빠진다(assignment.py).
#
# accountId 찾는 법: Jira에서 해당 팀원 프로필을 열면 주소가 .../jira/people/<accountId> 로 끝난다. 그 값을 붙여 넣는다.
# 계정 ID는 개인정보에 가까우므로 시험이 끝나면 지우거나 비운다. 한 계정을 두 사번에 쓰면 읽을 때 오류가 난다(1:1).
# 시험 담당자는 팀에서 바꿔도 된다. dataset/data/assignees.csv 에서 담당 그룹당 1명을 고르면 된다.

accounts:
  EMP-1321: ""   # 서비스데스크 박서연
  EMP-1064: ""   # 엔드포인트지원팀 강지호
  EMP-1370: ""   # 네트워크팀 조민재
  EMP-1233: ""   # 시스템인프라팀 임재원
  EMP-1130: ""   # 업무시스템팀 권다은
  EMP-1408: ""   # 정보보안팀 황민석
