<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ITssue 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Layout concept: 248px sidebar + work area (+440px detail panel). Warm white canvas, gray shell for ops screens. Brand orange is decoration; actions use orange-600. */
:root{
  --o500:#F37321;--o600:#C2540A;--o700:#9C4207;--osurf:#FFEAD9;--osoft:#FFF4EC;
  --ink:#111827;--ink2:#374151;--mute:#4B5563;--sec:#6B7280;
  --line:#E5E7EB;--line2:#F0F1F3;--shell:#F3F4F6;--card:#F8F9FA;--side:#FAFAFB;--canvas:#FFFDFB;--white:#FFFFFF;
  --inkbtn:#111827;--onink:#FFFFFF;--link:#C2540A;--field:#FFFFFF;--fieldline:#6B7280;
  --bubble:#111827;--onbubble:#FFFFFF;--shadow:0 1px 4px rgba(17,24,39,.10);--pop:0 20px 60px rgba(156,66,7,.20);
  --lg-ink:#111827;--lg-it:#F37321;
  --chart1:#C2540A;--chart2:#374151;--track:#F3F4F6;
  --s-recv-bg:#F3F4F6;--s-recv-fg:#4B5563;--s-recv-dot:#9CA3AF;
  --s-asg-bg:#E6F6F6;--s-asg-fg:#0B5F5F;--s-asg-dot:#0E8A8A;
  --s-info-bg:#E6F4FB;--s-info-fg:#075985;--s-info-dot:#0EA5E9;
  --s-prog-bg:#EAF1FE;--s-prog-fg:#1B4FC4;--s-prog-dot:#2F6FED;
  --s-need-bg:#F4EEFF;--s-need-fg:#5B21B6;--s-need-dot:#7C3AED;
  --s-re-bg:#E6F6F6;--s-re-fg:#0B5F5F;--s-re-dot:#0E8A8A;
  --s-ok-bg:#E8F7EE;--s-ok-fg:#0F6B34;--s-ok-dot:#16A34A;
  --s-urg-bg:#FEF3F2;--s-urg-fg:#B42318;--s-urg-dot:#D92D20;
  --s-warn-bg:#FFF6E0;--s-warn-fg:#7A4B00;--s-warn-dot:#D9A21B;
  --wash:radial-gradient(70% 46% at 24% 0%,#FFE4CE 0%,rgba(255,228,206,0) 72%),radial-gradient(60% 40% at 86% 0%,#FFEFD9 0%,rgba(255,239,217,0) 72%);
  --glow:linear-gradient(180deg,rgba(255,253,251,0),#FFF3E8 55%,#FFDDC2);
  --font:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono','D2Coding',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F3F4F6;--ink2:#D1D5DB;--mute:#AEB4BF;--sec:#9CA3AF;--line:#2B323C;--line2:#232933;--shell:#0F1217;--card:#1A1F27;--side:#12161C;--canvas:#0E1116;--white:#171C23;
  --inkbtn:#F3F4F6;--onink:#111827;--link:#FFA566;--field:#12161C;--fieldline:#6B7280;--bubble:#2A313B;--onbubble:#F3F4F6;--shadow:0 1px 4px rgba(0,0,0,.5);--pop:0 20px 60px rgba(0,0,0,.5);
  --lg-ink:#F3F4F6;--chart1:#FF9A57;--chart2:#C9CED6;--track:#232933;--osurf:#3A2515;--osoft:#241A12;
  --s-recv-bg:#262C35;--s-recv-fg:#C2C8D2;--s-asg-bg:#0F2E2E;--s-asg-fg:#6FD3D3;--s-info-bg:#0F2A3A;--s-info-fg:#7CC8F0;--s-prog-bg:#16254A;--s-prog-fg:#8FB0FF;--s-need-bg:#2A1E4A;--s-need-fg:#C4A8FF;--s-re-bg:#0F2E2E;--s-re-fg:#6FD3D3;--s-ok-bg:#0F2E1C;--s-ok-fg:#6FD79A;--s-urg-bg:#3A1714;--s-urg-fg:#FF9A90;--s-warn-bg:#33270A;--s-warn-fg:#F0C25A;
  --wash:radial-gradient(70% 46% at 24% 0%,#3A2515 0%,rgba(58,37,21,0) 72%);--glow:linear-gradient(180deg,rgba(14,17,22,0),#241A12 55%,#3A2515);color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#F3F4F6;--ink2:#D1D5DB;--mute:#AEB4BF;--sec:#9CA3AF;--line:#2B323C;--line2:#232933;--shell:#0F1217;--card:#1A1F27;--side:#12161C;--canvas:#0E1116;--white:#171C23;
  --inkbtn:#F3F4F6;--onink:#111827;--link:#FFA566;--field:#12161C;--fieldline:#6B7280;--bubble:#2A313B;--onbubble:#F3F4F6;--shadow:0 1px 4px rgba(0,0,0,.5);--pop:0 20px 60px rgba(0,0,0,.5);
  --lg-ink:#F3F4F6;--chart1:#FF9A57;--chart2:#C9CED6;--track:#232933;--osurf:#3A2515;--osoft:#241A12;
  --s-recv-bg:#262C35;--s-recv-fg:#C2C8D2;--s-asg-bg:#0F2E2E;--s-asg-fg:#6FD3D3;--s-info-bg:#0F2A3A;--s-info-fg:#7CC8F0;--s-prog-bg:#16254A;--s-prog-fg:#8FB0FF;--s-need-bg:#2A1E4A;--s-need-fg:#C4A8FF;--s-re-bg:#0F2E2E;--s-re-fg:#6FD3D3;--s-ok-bg:#0F2E1C;--s-ok-fg:#6FD79A;--s-urg-bg:#3A1714;--s-urg-fg:#FF9A90;--s-warn-bg:#33270A;--s-warn-fg:#F0C25A;
  --wash:radial-gradient(70% 46% at 24% 0%,#3A2515 0%,rgba(58,37,21,0) 72%);--glow:linear-gradient(180deg,rgba(14,17,22,0),#241A12 55%,#3A2515);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--mono)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lg{display:block;max-width:100%;height:auto}
:focus-visible{outline:2px solid var(--o600);outline-offset:2px;border-radius:8px}
:root[data-theme="dark"] :focus-visible{outline-color:#FFA566}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :focus-visible{outline-color:#FFA566}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:600;font-size:14px;line-height:20px;white-space:nowrap;transition:background .12s,box-shadow .12s}
.btn.pri{background:var(--o600);color:#fff}.btn.pri:hover{background:var(--o700)}
.btn.ink{background:var(--inkbtn);color:var(--onink)}
.btn.sec{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--fieldline)}.btn.sec:hover{background:var(--card)}
.btn.ghost{background:transparent;color:var(--link);padding:0 10px}.btn.ghost:hover{background:var(--osoft)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.ico{width:44px;padding:0;border-radius:999px}.btn.ico.sm{width:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:500;border:0;color:var(--ink)}
.chip:hover{box-shadow:inset 0 0 0 1px var(--o600);color:var(--link)}
.chip.on{background:var(--osoft);box-shadow:inset 0 0 0 1.5px var(--o600);color:var(--link)}
.chip .i{width:18px;height:18px}
.chip[disabled]{opacity:.5;cursor:default}

/* ---- badges ---- */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;flex:none}
.badge .lb{transform:translateY(-.08em)}
.b-recv{background:var(--s-recv-bg);color:var(--s-recv-fg)}.b-recv i{background:var(--s-recv-dot)}
.b-asg{background:var(--s-asg-bg);color:var(--s-asg-fg)}.b-asg i{background:var(--s-asg-dot)}
.b-prog{background:var(--s-prog-bg);color:var(--s-prog-fg)}.b-prog i{background:var(--s-prog-dot)}
.b-need{background:var(--s-need-bg);color:var(--s-need-fg)}.b-need i{background:var(--s-need-dot)}
.b-re{background:var(--s-re-bg);color:var(--s-re-fg)}.b-re i{background:var(--s-re-dot)}
.b-ok{background:var(--s-ok-bg);color:var(--s-ok-fg)}.b-ok i{background:var(--s-ok-dot)}
.b-urg{background:var(--s-urg-bg);color:var(--s-urg-fg)}.b-urg i{background:var(--s-urg-dot)}
.b-warn{background:var(--s-warn-bg);color:var(--s-warn-fg)}.b-warn i{background:var(--s-warn-dot)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px 1px;border-radius:999px;background:var(--o600);color:#fff;font-size:12px;font-weight:700}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--osurf);color:var(--o700);font-size:12px;font-weight:700;letter-spacing:.02em}
:root[data-theme="dark"] .tag{color:#FFB98A}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#FFB98A}}
.tag.gray{background:var(--shell);color:var(--mute)}
.pri-p1,.pri-p2,.pri-p3,.pri-p4{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;font-family:var(--font);letter-spacing:0}
.pri-p1{background:var(--s-urg-bg);color:var(--s-urg-fg)}.pri-p2{background:var(--s-warn-bg);color:var(--s-warn-fg)}.pri-p3{background:var(--s-prog-bg);color:var(--s-prog-fg)}.pri-p4{background:var(--s-recv-bg);color:var(--s-recv-fg)}

/* ---- inputs ---- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--ink2)}
.inp,.sel,.ta{min-height:44px;width:100%;padding:0 14px;border-radius:12px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--fieldline);font-size:15px}
.ta{padding:10px 14px;min-height:88px;resize:vertical;line-height:24px}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--o600);outline-offset:1px;box-shadow:inset 0 0 0 1px var(--o600)}
.inp.err{box-shadow:inset 0 0 0 1.5px var(--s-urg-dot)}
.hint{font-size:12px;color:var(--mute)}.errtx{font-size:12.5px;color:var(--s-urg-fg);font-weight:500}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--shell)}
.seg button{border:0;background:transparent;min-height:36px;padding:0 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--white);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* ---- logo / avatar ---- */
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#F37321;background-image:linear-gradient(180deg,#FF8F45,#F37321 55%,#E0640D)}
.av.flat{background-image:none}
.av svg{--lg-it:#fff}

/* ---- app shell ---- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%;min-height:0}
.app.has-detail{grid-template-columns:248px minmax(0,1fr) 440px}
.side{background:var(--side);border-right:1px solid var(--line2);padding:20px 12px 14px 16px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.side .brand{padding:2px 8px 4px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .grp{font-size:12px;font-weight:600;color:var(--mute);padding:10px 12px 4px}
.nav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--ink2);text-align:left}
.nav button:hover{background:var(--shell)}
.nav button.on{background:var(--white);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.nav button.on .i{color:var(--o600)}
.nav button .count{margin-left:auto}
.recent{display:flex;flex-direction:column;gap:2px}
.recent .rt{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border-radius:12px;border:0;background:transparent;text-align:left}
.recent .rt:hover{background:var(--shell)}
.recent .rt.on{background:var(--white);box-shadow:var(--shadow)}
.recent .rt b{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;line-height:20px}
.recent .rt small{font-size:12px;color:var(--mute);line-height:16px}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 2px}
.who .pf{width:34px;height:34px;border-radius:50%;background:var(--osurf);color:var(--o700);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
:root[data-theme="dark"] .who .pf{color:#FFB98A}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .who .pf{color:#FFB98A}}
.who .nm{font-size:13px;font-weight:600;line-height:18px}.who small{font-size:12px;color:var(--mute);display:block;line-height:16px}
.who .out{margin-left:auto}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--canvas)}
.main>*{position:relative;z-index:1}
.main .bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;border-bottom:1px solid var(--line2);background:color-mix(in srgb,var(--canvas) 72%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);flex:none}
.top h2{font-size:16px;line-height:24px;font-weight:600}.top .sub{font-size:12px;color:var(--mute)}
.top .menu{display:none}
.scroll{flex:1;min-height:0;overflow:auto}

/* ---- chat ---- */
.thread{max-width:820px;width:100%;margin:0 auto;padding:28px 32px 24px;display:flex;flex-direction:column;gap:20px}
.msg.u{align-self:flex-end;max-width:78%;background:var(--bubble);color:var(--onbubble);padding:10px 16px;border-radius:18px 18px 6px 18px;font-size:15px;line-height:24px}
.msg.a{display:flex;gap:12px;align-items:flex-start}
.msg.a .body{flex:1;min-width:0;max-width:88%;font-size:15px;line-height:27px}
.msg.a .body p+p{margin-top:8px}
.msg.a ol{margin:8px 0 0;padding-left:20px}.msg.a li{margin:2px 0}
.msg.sys{align-self:center;font-size:12.5px;color:var(--mute);background:var(--shell);padding:4px 12px;border-radius:999px;text-align:center}
.replies{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:10px;margin-right:6px;min-height:32px;padding:0 12px;border-radius:8px;background:var(--card);border:0;box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--ink2);font-weight:500}
.src:hover{box-shadow:inset 0 0 0 1px var(--o600)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px}
.card.w{background:var(--white);box-shadow:inset 0 0 0 1px var(--line)}
.card h4{font-size:15px;font-weight:600;line-height:22px}
.dl{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin-top:12px}
.dl dt{color:var(--mute)}.dl dd{margin:0}
.dots{display:inline-flex;gap:4px;align-items:center;height:20px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--o500);animation:wave 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.composer-wrap{flex:none;padding:30px 32px 20px;background:var(--glow)}
.composer{display:flex;align-items:flex-end;gap:6px;max-width:760px;margin:0 auto;background:var(--white);border-radius:24px;padding:8px 8px 8px 12px;box-shadow:0 12px 40px rgba(156,66,7,.14),0 0 0 1px var(--line)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;max-height:140px;padding:10px 6px;font-size:16px;line-height:24px;outline:0}
.composer .btn.ico.pri{background:var(--o600)}
.notice{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--mute)}
.stepper{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin-top:14px}
.stepper .st{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;min-width:0;padding:0 2px}
.stepper .st b{font-weight:600;line-height:16px}.stepper .st small{font-size:12px;color:var(--mute);line-height:14px}
.stepper .st .n{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--white);box-shadow:inset 0 0 0 2px var(--line);position:relative;z-index:1;color:#fff}
.stepper .st:not(:first-child)::before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line)}
.stepper .st.done:not(:first-child)::before,.stepper .st.cur:not(:first-child)::before{background:var(--tone,var(--s-prog-dot))}
.stepper .st.done .n{background:var(--tone,var(--s-prog-dot));box-shadow:none}
.stepper .st.cur .n{background:var(--white);box-shadow:inset 0 0 0 2px var(--tone,var(--s-prog-dot))}
.stepper .st.cur .n::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--tone,var(--s-prog-dot))}
.stepper .st.todo b{color:var(--mute);font-weight:500}
.stepper .i{width:14px;height:14px;stroke-width:2.6}

/* ---- new inquiry (empty) ---- */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 32px 56px;gap:0;text-align:center}
.hero h1{font-size:36px;line-height:46px;font-weight:600;letter-spacing:-.01em;margin-top:6px}
.hero .hi{font-size:14px;color:var(--mute);margin-top:18px}
.hero .composer{width:100%;max-width:720px;margin-top:30px;min-height:72px;align-items:center;padding:8px 10px 8px 14px}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px;margin-top:20px}
.faqs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:720px;width:100%;margin-top:30px;text-align:left}
.faqc{background:color-mix(in srgb,var(--white) 88%,transparent);border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);border:0;text-align:left}
.faqc:hover{box-shadow:inset 0 0 0 1px var(--o600)}
.faqc b{display:block;font-size:14px;line-height:20px}.faqc small{font-size:12px;color:var(--mute);line-height:16px;display:block;margin-top:4px}

/* ---- pages ---- */
.page{padding:26px 32px 40px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%;margin:0 auto}
.page h1{font-size:28px;line-height:36px;font-weight:600}
.eyebrow{font-size:12px;font-weight:700;color:var(--link);letter-spacing:.04em}
.ops{background:var(--shell)}.ops .main{background:var(--shell)}
.panel{background:var(--white);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:20px 22px;min-width:0}
.panel h3{font-size:15px;line-height:22px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--white);border-radius:16px;padding:18px 20px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;border:0;min-width:0}
button.kpi:hover{box-shadow:inset 0 0 0 1px var(--o600)}
.kpi .l{font-size:13px;color:var(--mute);font-weight:500}
.kpi .v{display:flex;align-items:baseline;gap:4px;margin-top:6px}.kpi .v b{font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.kpi .v span{font-size:15px;color:var(--ink2);font-weight:500}
.kpi .d{font-size:12px;margin-top:6px;color:var(--mute)}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}

/* ---- A안: 전체 배경 + 반투명 사이드바 ---- */
:root{--ag1:rgba(255,170,110,.62);--ag2:rgba(255,154,87,.5);--ag3:rgba(255,154,87,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ag1:rgba(255,140,70,.2);--ag2:rgba(255,140,70,.16);--ag3:rgba(255,140,70,.14)}}

.app{position:relative;background:var(--canvas)}

.app::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 42% 34% at 22% 104%,var(--ag1),transparent 72%),radial-gradient(ellipse 36% 32% at 78% 104%,var(--ag2),transparent 72%),radial-gradient(ellipse 60% 22% at 50% 110%,var(--ag3),transparent 75%)}
.app>.main,.app>.side,.app>.detail{z-index:1}
.main>svg.bg{display:none}
.main,.ops .main{background:transparent!important}
.side{background:color-mix(in srgb,var(--white) 62%,transparent)!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-right:1px solid rgba(17,24,39,.06)!important}

.faq summary{cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none;padding:16px 20px}.faq summary::-webkit-details-marker{display:none}

.rs{display:inline-flex;align-items:center;gap:5px;font-weight:600}.rs i{width:6px;height:6px;border-radius:50%;display:inline-block}
/* ---- 단계 파장 ---- */
.stepper .st.cur .n::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--tone,var(--s-prog-dot));animation:ripple 1.9s ease-out infinite;pointer-events:none}
.stepper .st.cur .n::after{animation:beat 1.9s ease-in-out infinite}
.stepper .st.done.chg .n{animation:pop .35s ease-out}
@keyframes ripple{0%{transform:scale(1);opacity:.65}100%{transform:scale(2.2);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stepper .st.cur .n::before,.stepper .st.cur .n::after,.stepper .st.done .n{animation:none}}

/* 대시보드 숫자: 화면에 처음 나올 때 0에서, 값이 바뀌면 이전 값에서 올라간다 (같은 값으로 다시 그릴 땐 움직이지 않음) */
window.__kpi=window.__kpi||{};
function animateKpis(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.kpi .v b').forEach((el,n)=>{
    const m=String(el.textContent).trim().match(/^(\$?)([\d,]+(?:\.(\d+))?)(.*)$/);if(!m)return;
    const to=parseFloat(m[2].replace(/,/g,'')),dec=m[3]?m[3].length:0,comma=m[2].includes(','),k=key()+'|'+n;
    const from=k in window.__kpi?window.__kpi[k]:0;window.__kpi[k]=to;
    if(from===to)return;
    const fmt=v=>m[1]+(comma?v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}):v.toFixed(dec))+m[4];
    const t0=performance.now()+Math.min(n,5)*40,dur=600;el.textContent=fmt(from);
    const f=t=>{const p=Math.min(1,Math.max(0,(t-t0)/dur)),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f);};
    requestAnimationFrame(f);
  });
}

const RE={
  sec:/(피싱|악성|랜섬|해킹|도용|탈취|도난|분실|유출|의심.{0,6}(메일|링크|파일|접속)|(링크|첨부).{0,8}(눌렀|열었|클릭))/,
  multi:/(전사|전체 직원|전 직원|여러 부서|다른 팀도|모든 팀|(?:[2-9]\d|\d{3,})\s*명|다들)/,
  wide:/(전사|전체 직원|전 직원|여러 부서|(?:[2-9]\d|\d{3,})\s*명|다수)/,
  stop:/(중단|불가|못 ?해|안 ?돼|먹통|접속.*안|전혀)/,
  rest:/(보안 예외|USB|반출|예외 신청)/

function detectCat(t){
  if(RE.sec.test(t))return 'SEC';
  if(/(VPN|와이파이|Wi-?Fi|인터넷|네트워크|사내망|랜선)/i.test(t))return 'NET';
  if(/(권한)/.test(t))return 'ACS';
  if(/(프린터|복합기|인쇄|노트북|PC|마우스|키보드|모니터|화면)/i.test(t))return 'HW';
  if(/(설치|프로그램|라이선스|소프트웨어|Excel|엑셀|PDF)/i.test(t))return 'SW';
  if(/(ERP|전자결재|근태|인사|포털|메신저|서버|DB)/i.test(t))return 'SYS';
  if(/(계정|잠[겼금]|로그인|비밀번호|패스워드|SSO|MFA|OTP)/i.test(t))return 'ACC';

}
const allText=i=>i.msgs.filter(m=>m.r==='u').map(m=>m.t).join(' ')+' '+Object.values(i.intake).join(' ');
function calcPrio(i,text){
  const t=text||allText(i),why=[];let p='P3';
  const sec=RE.sec.test(t),multi=RE.multi.test(t),stop=RE.stop.test(t);
  if(sec){p='P2';why.push('보안 사고 의심은 최소 P2');if(RE.wide.test(t)){p='P1';why.push('다수 사용자·광범위한 보안 대응 필요');}}
  else if(multi&&stop){p='P1';why.push('여러 사용자의 업무 중단 정황');}
  else if(/(전면|모두 중단|업무.{0,6}(불가|중단)|아무것도 못|아예)/.test(t)&&!/(대체|가능)/.test(t)){p='P2';why.push('개인 업무 전면 중단');}
  else if(/(문의|신청|궁금|알려|방법)/.test(t)&&!stop){p='P4';why.push('현재 업무 지장 없는 문의·사전 신청');}
  else{why.push('개인 업무 일부 지장, 대체 방법 있음');}
  if(/(급해|빨리|급합니다)/.test(t))why.push('"급하다"는 표현만으로 상향하지 않음');
  return {p,why};
}

function series(per,seed,scale){
  const rnd=i=>{const x=Math.sin((i+1)*12.9898+seed*78.233)*43758.5453;return x-Math.floor(x);};
  let labels;
  if(per==='d')labels=Array.from({length:14},(_,i)=>{const d=new Date(2026,9,16-13+i);return (d.getMonth()+1)+'.'+d.getDate();});
  else if(per==='w')labels=Array.from({length:10},(_,i)=>'W'+(33+i));
  else labels=['25.11','25.12','26.01','26.02','26.03','26.04','26.05','26.06','26.07','26.08','26.09','26.10'];
  const unit=per==='d'?scale:per==='w'?scale*7:scale*30;
  const n=labels.length,a=[],b=[];
  labels.forEach((l,i)=>{let x=Math.max(1,Math.round(unit*(0.75+rnd(i)*0.5)*(per==='d'&&(i%7===5||i%7===6)?0.3:1)));if(i===n-1)x=Math.max(1,Math.round(x*(per==='d'?0.6:0.5)));a.push(x);b.push(Math.max(0,Math.round(x*(0.86+rnd(i+9)*0.12))));});

const PAGE_N=20;

function aiSeries(r){
  const rnd=i=>{const x=Math.sin(i*12.9898+r.length*78.233)*43758.5453;return x-Math.floor(x);};
  let labels,base,budget;
  if(r==='day'){labels=Array.from({length:14},(_,i)=>{const d=new Date(2026,9,3+i);return (d.getMonth()+1)+'.'+d.getDate();});base=26;budget=9;}
  else if(r==='month'){labels=['25.11','25.12','26.01','26.02','26.03','26.04','26.05','26.06','26.07','26.08','26.09','26.10'];base=640;budget=220;}
  else{labels=['2024','2025','2026'];base=5200;budget=2600;}
  const n=labels.length;
  return labels.map((l,i)=>{let tot=Math.round(base*(0.8+i*(r==='year'?0.55:0.035)+rnd(i)*0.25));if(r==='year')tot=[3900,6800,8900][i];const rate=0.58+i*(r==='year'?0.08:0.012)+rnd(i+5)*0.04;let ai=Math.round(tot*Math.min(.9,rate));if(i===n-1&&r==='day'){tot+=S.aiLive;ai+=S.aiLive;}return {l,tot,ai,cost:+(tot*0.038).toFixed(2),budget};});
}

function doLogin(id,pw,skipPw){
  const a=S.accounts.find(x=>x.id.toLowerCase()===String(id).trim().toLowerCase());
  /* 잠김은 10분이 지나면 자동으로 풀린다 */
  if(a&&a.status==='잠김'&&a.lockedUntil&&Date.now()>=a.lockedUntil){a.status='정상';delete a.lockedUntil;a.fails=0;S.acctHist.unshift({t:NOW(),who:'시스템',target:a.id+' · '+a.name,what:'잠금 해제',why:'10분 경과 (자동 해제)'});}
  if(a&&a.status==='잠김'){const left=Math.max(1,Math.ceil(((a.lockedUntil||Date.now())-Date.now())/60000));S.loginErr='로그인 5회 실패로 잠긴 계정이에요. 약 '+left+'분 후 자동으로 해제돼요. 급하면 서비스데스크로 문의해 주세요. ('+SERVICEDESK_PHONE+')';render();return;}
  if(!a||(!skipPw&&a.pw&&a.pw!==pw)||(!skipPw&&!a.pw&&pw!=='demo')){
    S.loginErr='사번 또는 비밀번호를 확인해 주세요.';
    if(a){
      a.fails=(a.fails||0)+1;
      if(a.fails===3)addSec('로그인 반복 실패','중간',a.id,'3회 연속 실패 (5회 시 잠금)','실패 3회','반복 실패 감지');
      if(a.fails>=5&&a.status==='정상'){a.status='잠김';a.lockedUntil=Date.now()+10*60000;a.fails=0;addSec('로그인 반복 실패','중간',a.id,'5회 연속 실패로 계정 잠금','실패 5회','5회 실패 잠금');S.acctHist.unshift({t:NOW(),who:'시스템',target:a.id+' · '+a.name,what:'잠김',why:'로그인 5회 실패 (10분 후 자동 해제)'});S.loginErr='로그인 5회 실패로 계정이 잠겼어요. 10분 후 자동으로 해제돼요. 급하면 서비스데스크로 문의해 주세요. ('+SERVICEDESK_PHONE+')';}
    }
    render();return;
  }
  if(a.status==='이용 제한'){addSec('이용 제한 계정 접속 시도','낮음',a.id,'이용 제한 상태 계정으로 로그인 시도','로그인 시도 차단','이용 제한 계정 시도');S.loginErr='이용이 제한된 계정이에요. 서비스데스크로 문의해 주세요. ('+SERVICEDESK_PHONE+')';render();return;}
  a.fails=0;
  S.loginErr='';S.user=a.id;S.role=a.role==='관리자'?'admin':a.role==='담당자'?'staff':'user';

    const first=f[0],last=f[f.length-1],inside=box.contains(document.activeElement);
    if(ev.shiftKey&&(!inside||document.activeElement===first)){ev.preventDefault();last.focus();}

  }
});
