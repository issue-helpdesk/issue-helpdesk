# 운영 DB. 앱(docker-compose.yml)과 따로 올리고 내린다. 저장소 루트에서 실행.
#   docker compose -f docker-compose.db.yml up -d
# 준비물: 루트 .env 의 POSTGRES_DB·POSTGRES_USER·POSTGRES_PASSWORD (값은 .env.example 참고)
# 접속: 포트를 열지 않는다. 앱은 itssue-db-net 네트워크로, 사람은 아래 명령으로 붙는다.
#   docker compose -f docker-compose.db.yml exec db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
# 주의: down -v 는 데이터 볼륨까지 지운다.

name: itssue-db

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    restart: unless-stopped
    # 기본 10초면 종료 중 강제로 끊겨 다음 시작 때 복구 과정을 거칠 수 있다
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    name: itssue-pgdata

networks:
  db-net:
    name: itssue-db-net
