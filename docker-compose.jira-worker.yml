# 기존 서비스와 함께 실행:
# docker compose -f docker-compose.yml -f docker-compose.jira-worker.yml up -d --build jira-worker
# DB 마이그레이션·Jira 설정 적용 뒤 시작한다. 기본값은 세 종류 모두 처리한다.
# 워커는 2개를 띄운다. 한쪽이 멈춰도 다른 쪽이 이어받는다. 같은 작업을 둘이 잡지 않도록 DB 에서 선점한다.
services:
  jira-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "backend/app/integrations/jira/worker.py", "--interval", "30", "--limit", "10"]
    restart: unless-stopped
    deploy:
      replicas: 2
    stop_grace_period: 60s
