# 저장소 루트에서 실행. 로컬과 EC2 가 같은 명령을 쓴다.
#   docker compose up -d --build
# 준비물: 루트 .env (값은 .env.example 참고), 임베딩 모델 폴더 (기본 /home/ubuntu/models, MODELS_DIR 로 바꿀 수 있다)
# 어느 DB 에 붙을지는 .env 의 DATABASE_URL 이 정한다. 로컬은 Supabase, EC2 는 도커 DB (docker-compose.db.yml).
# EC2 는 .env 의 COMPOSE_FILE 로 docker-compose.server.yml 을 함께 읽어 도커 DB 에 붙고 마이그레이션을 돌린다.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      EMBEDDING_MODEL_DIR: /models
    volumes:
      - ${MODELS_DIR:-/home/ubuntu/models}:/models:ro
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # EMBEDDING_PRELOAD=true 면 모델을 여는 데 약 28초 걸린다
      start_period: 60s

  # Jira 설정 적용 뒤 시작한다. 기본값은 세 종류 모두 처리한다.
  # 워커는 2개를 띄운다. 한쪽이 멈춰도 다른 쪽이 이어받는다. 같은 작업을 둘이 잡지 않도록 DB 에서 선점한다.
  jira-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "backend/app/integrations/jira/worker.py", "--interval", "30", "--limit", "10"]
    restart: unless-stopped
    deploy:
      replicas: 2
    stop_grace_period: 60s

  # 프론트를 Vercel 이 맡아 기본은 꺼 둔다. 켜려면 .env 에 COMPOSE_PROFILES=web (한 번만: docker compose --profile web up -d)
  # 이미 떠 있던 web 은 저절로 내려가지 않는다. 끌 때는 docker compose rm -sf web
  web:
    profiles: ["web"]
    build:
      context: frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
