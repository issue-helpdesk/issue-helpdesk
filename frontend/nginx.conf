# 프론트와 API 를 같은 출처로 묶는다. Refresh 쿠키가 SameSite=Strict 라 출처가 달라지면 로그인 연장이 안 된다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 문서 업로드. 크기 제한은 서버(MAX_DOCUMENT_FILE_MB)가 받으면서 판단한다.
    # 그러려면 nginx 가 크기를 보지 않고(기본 1MB) 끝까지 받아 두지도 않고 바로 넘겨야 한다
    location ~ ^/api/v1/documents/[0-9]+/versions(/[0-9]+/retry)?/?$ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API 는 백엔드 컨테이너로 넘긴다 (경로 /api/v1 그대로)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 판단(LLM 호출)이 길어질 수 있다
        proxy_read_timeout 120s;
    }

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅: 없는 경로는 index.html 로 (vercel.json 의 rewrites 와 같은 역할)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
