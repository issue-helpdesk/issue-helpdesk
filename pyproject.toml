[project]
name = "issue-helpdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pdfplumber==0.11.10",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pyjwt==2.15.1",
    "pypdf==6.20.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "python-pptx==1.0.2",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.5",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
embedding = [
    "psutil==7.2.2",
    "sentence-transformers==6.0.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest==9.1.1",
]
[tool.poe.tasks]
dev = "uvicorn app.main:app --app-dir backend --reload --reload-dir backend"
